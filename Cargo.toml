[workspace]
resolver = "3"
members = ["src-tauri", "crates/domain", "crates/tracker", "crates/card-db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3.0-only"
repository = "https://github.com/VillegasMich/draw-ex"
publish = false

# Shared versions. specta is an rc: pin it exactly, as tauri-specta requires.
[workspace.dependencies]
domain = { path = "crates/domain" }
card-db = { path = "crates/card-db" }
tracker = { path = "crates/tracker" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2.0.21"
